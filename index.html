<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبض | NABD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1018;color:#f4f7fb;font-family:Tahoma,Arial,sans-serif}
.hidden{display:none!important}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card,.card,.sidebar{background:#111a26;border:1px solid #263447;border-radius:17px;padding:18px}
.auth-card{width:min(420px,100%)}
.logo,.brand{color:#35a7ff;font-size:35px;font-weight:bold;text-align:center}
.tagline{text-align:center;color:#91a0b4;margin-bottom:20px}
.field{width:100%;padding:13px;margin:7px 0;background:#0b131e;color:white;border:1px solid #263447;border-radius:12px}
.primary{background:#35a7ff;color:#04111d;font-weight:bold;padding:12px 18px;border-radius:12px}
.full{width:100%;margin-top:10px}
.link{color:#35a7ff;cursor:pointer}
.switch{text-align:center;margin-top:15px;color:#91a0b4}
#app{max-width:1100px;margin:auto;display:grid;grid-template-columns:220px 1fr 220px;gap:18px;padding:18px}
.sidebar{height:calc(100vh - 36px);position:sticky;top:18px}
.nav button{display:block;width:100%;text-align:right;background:transparent;color:white;padding:14px;border-radius:10px;margin:5px 0}
.nav button:hover{background:#172333;color:#35a7ff}
.brand{text-align:right;margin-bottom:20px}
.feed{min-width:0}
.topbar{padding:12px 4px 18px}
.card{margin-bottom:14px}
textarea{width:100%;min-height:90px;resize:vertical;background:transparent;color:white;border:0;outline:0}
.composer-bottom{display:flex;justify-content:space-between;border-top:1px solid #263447;padding-top:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#287fc1;display:grid;place-items:center;font-weight:bold;flex:none}
.post-head{display:flex;gap:10px;align-items:center}
.muted{color:#91a0b4}
.small{font-size:12px}
.post-text{white-space:pre-wrap;line-height:1.8;margin:15px 0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #263447;padding-top:10px}
.action{background:transparent;color:#91a0b4;padding:8px}
.action:hover{color:white}
.liked{color:#ff5572}
.comment{background:#0c1520;border-radius:10px;padding:10px;margin-top:8px}
.comment-form{display:flex;gap:7px;margin-top:10px}
.comment-form input{flex:1;min-width:0}
.empty{text-align:center;padding:30px;color:#91a0b4}
.search{width:100%;padding:12px;background:#0b131e;color:white;border:1px solid #263447;border-radius:12px}
.user-result{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #263447;gap:8px}
.follow{background:#172333;color:white;padding:8px 12px;border-radius:10px}
.follow.on{background:#173d59;color:#8bd1ff}
.notice{padding:13px;border-bottom:1px solid #263447}
.stat-row{display:flex;gap:20px;margin:15px 0}
.stat b{display:block;font-size:20px}
.mobile-nav{display:none}
@media(max-width:850px){
#app{grid-template-columns:70px 1fr}
.rightbar{display:none}
.brand{font-size:20px;text-align:center}
.nav button{text-align:center;font-size:0}
.nav button::first-letter{font-size:20px}
}
@media(max-width:550px){
#app{display:block;padding:8px 8px 75px}
.sidebar{display:none}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111a26;border-top:1px solid #263447;justify-content:space-around;padding:10px;z-index:5}
.mobile-nav button{background:transparent;color:white;font-size:20px}
}
</style>
</head>
<body>

<section id="auth">
<div class="auth-card">
<div class="logo">نبض</div>
<div class="tagline">مساحتك للتعبير والتواصل</div>

<div id="loginForm">
<h2>تسجيل الدخول</h2>
<input id="loginEmail" class="field" type="email" placeholder="البريد الإلكتروني">
<input id="loginPassword" class="field" type="password" placeholder="كلمة المرور">
<button class="primary full" onclick="authenticate('login')">دخول</button>
<div class="switch">ما عندك حساب؟
<span class="link" onclick="toggleAuth('register')">إنشاء حساب</span></div>
</div>

<div id="registerForm" class="hidden">
<h2>إنشاء حساب</h2>
<input id="regName" class="field" placeholder="الاسم الظاهر">
<input id="regUsername" class="field" placeholder="اسم المستخدم">
<input id="regEmail" class="field" type="email" placeholder="البريد الإلكتروني">
<input id="regPassword" class="field" type="password" placeholder="كلمة المرور">
<button class="primary full" onclick="authenticate('register')">إنشاء الحساب</button>
<div class="switch">عندك حساب؟
<span class="link" onclick="toggleAuth('login')">تسجيل الدخول</span></div>
</div>
<p id="authMessage" class="small"></p>
</div>
</section>

<div id="app" class="hidden">
<aside class="sidebar">
<div class="brand">نبض.</div>
<nav class="nav">
<button onclick="go('home')">⌂ الرئيسية</button>
<button onclick="go('search')">⌕ استكشاف</button>
<button onclick="go('notifications')">♧ الإشعارات</button>
<button onclick="go('profile')">♙ الملف الشخصي</button>
</nav>
<button class="primary full" onclick="logout()">تسجيل الخروج</button>
</aside>

<main class="feed">
<div class="topbar"><b id="pageHeading">الرئيسية</b></div>

<section id="homePage">
<div class="card">
<textarea id="postText" maxlength="500" placeholder="شنو قاعد تفكر فيه؟"></textarea>
<div class="composer-bottom">
<span class="muted small">شارك نبضك</span>
<button class="primary" onclick="createPost()">نشر</button>
</div>
</div>
<div id="timeline"></div>
</section>

<section id="searchPage" class="hidden">
<h2>استكشاف</h2>
<input id="searchInput" class="search" placeholder="ابحث عن أشخاص أو منشورات..." oninput="renderSearch()">
<div id="searchResults"></div>
</section>

<section id="notificationsPage" class="hidden">
<h2>الإشعارات</h2>
<div id="notificationList" class="card"></div>
</section>

<section id="profilePage" class="hidden">
<div id="profileContent"></div>
</section>
</main>

<aside class="rightbar card">
<h3>عن نبض</h3>
<p class="muted">منصة اجتماعية تجريبية بسيطة.</p>
</aside>
</div>

<div id="mobileNav" class="mobile-nav hidden">
<button onclick="go('home')">⌂</button>
<button onclick="go('search')">⌕</button>
<button onclick="go('notifications')">♧</button>
<button onclick="go('profile')">♙</button>
<button onclick="logout()">⇥</button>
</div>

<script>
const $=id=>document.getElementById(id);
const DB_KEY='nabd_database_v1';
const SESSION_KEY='nabd_current_v1';

let db=loadDB();
let current=null;
let activePage='home';

function loadDB(){
 try{
  const saved=JSON.parse(localStorage.getItem(DB_KEY));
  if(saved&&Array.isArray(saved.users)&&Array.isArray(saved.posts)&&Array.isArray(saved.notifications))return saved;
 }catch(e){}
 return {users:[],posts:[],notifications:[]};
}

function saveDB(){
 localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function saveSession(){
 if(current)localStorage.setItem(SESSION_KEY,current);
 else localStorage.removeItem(SESSION_KEY);
}

function me(){
 return db.users.find(u=>u.id===current)||null;
}

function safe(text){
 return String(text??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function toggleAuth(mode){
 $('loginForm').classList.toggle('hidden',mode!=='login');
 $('registerForm').classList.toggle('hidden',mode!=='register');
 $('authMessage').textContent='';
}

function authenticate(mode){
 const message=$('authMessage');
 message.style.color='#ff8294';

 if(mode==='register'){
  const name=$('regName').value.trim();
  const username=$('regUsername').value.trim().replace(/^@/,'').toLowerCase();
  const email=$('regEmail').value.trim().toLowerCase();
  const password=$('regPassword').value;

  if(!name||!username||!email||!password){
   message.textContent='عبّئ كل الخانات.';
   return;
  }

  if(!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)){
   message.textContent='اسم المستخدم يجب أن يكون 3 إلى 20 حرفاً إنجليزياً أو رقماً.';
   return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
   message.textContent='اكتب بريداً إلكترونياً صحيحاً.';
   return;
  }

  if(password.length<6){
   message.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
   return;
  }

  if(db.users.some(u=>u.email===email)){
   message.textContent='هذا البريد مسجل من قبل.';
   return;
  }

  if(db.users.some(u=>u.username===username)){
   message.textContent='اسم المستخدم مستخدم من قبل.';
   return;
  }

  const user={
   id:makeId(),
   name,
   username,
   email,
   password,
   bio:'',
   following:[],
   createdAt:Date.now()
  };

  db.users.push(user);
  saveDB();
  current=user.id;
  saveSession();
  start();
  return;
 }

 const email=$('loginEmail').value.trim().toLowerCase();
 const password=$('loginPassword').value;

 if(!email||!password){
  message.textContent='اكتب البريد وكلمة المرور.';
  return;
 }

 const user=db.users.find(u=>u.email===email&&u.password===password);

 if(!user){
  message.textContent='البريد أو كلمة المرور غير صحيحة.';
  return;
 }

 current=user.id;
 saveSession();
 start();
}

function start(){
 const user=me();

 if(!user){
  current=null;
  saveSession();
  showAuth();
  return;
 }

 $('auth').classList.add('hidden');
 $('app').classList.remove('hidden');
 $('mobileNav').classList.remove('hidden');
 go(activePage||'home');
}

function showAuth(){
 $('auth').classList.remove('hidden');
 $('app').classList.add('hidden');
 $('mobileNav').classList.add('hidden');
 toggleAuth('login');
}

function logout(){
 current=null;
 saveSession();
 showAuth();
}

function go(page){
 if(!me()){
  showAuth();
  return;
 }

 activePage=page;

 const pages={
  home:'homePage',
  search:'searchPage',
  notifications:'notificationsPage',
  profile:'profilePage'
 };

 Object.entries(pages).forEach(([key,id])=>{
  $(id).classList.toggle('hidden',key!==page);
 });

 $('pageHeading').textContent={
  home:'الرئيسية',
  search:'استكشاف',
  notifications:'الإشعارات',
  profile:'الملف الشخصي'
 }[page];

 if(page==='home')renderTimeline();
 if(page==='search')renderSearch();
 if(page==='notifications')renderNotifications();
 if(page==='profile')renderProfile(current);
}

function createPost(){
 const text=$('postText').value.trim();
 if(!text)return;

 db.posts.unshift({
  id:makeId(),
  userId:current,
  text,
  createdAt:Date.now(),
  likes:[],
  comments:[],
  reposts:[]
 });

 $('postText').value='';
 saveDB();
 renderTimeline();
}

function timeAgo(t){
 const sec=Math.max(0,Math.floor((Date.now()-t)/1000));
 if(sec<60)return 'الآن';
 if(sec<3600)return `قبل ${Math.floor(sec/60)} د`;
 if(sec<86400)return `قبل ${Math.floor(sec/3600)} س`;
 return `قبل ${Math.floor(sec/86400)} يوم`;
}

function postCard(post){
 const user=db.users.find(u=>u.id===post.userId);
 if(!user)return '';

 const liked=post.likes.includes(current);
 const reposted=post.reposts.includes(current);

 const comments=post.comments.map(c=>{
  const cu=db.users.find(u=>u.id===c.userId);
  return cu?`<div class="comment"><b>${safe(cu.name)}</b><div>${safe(c.text)}</div></div>`:'';
 }).join('');

 return `
 <article class="card">
  <div class="post-head">
   <div class="avatar">${safe(user.name.slice(0,1))}</div>
   <div>
    <b>${safe(user.name)}</b>
    <div class="muted small">@${safe(user.username)} · ${timeAgo(post.createdAt)}</div>
   </div>
  </div>

  <div class="post-text">${safe(post.text)}</div>

  <div class="actions">
   <button class="action ${liked?'liked':''}" onclick="likePost('${post.id}')">♥ ${post.likes.length}</button>
   <button class="action" onclick="toggleComments('${post.id}')">تعليق ${post.comments.length}</button>
   <button class="action ${reposted?'liked':''}" onclick="repost('${post.id}')">↻ ${post.reposts.length}</button>
   <button class="action" onclick="goProfile('${user.id}')">الملف الشخصي</button>
  </div>

  <div id="comments-${post.id}" class="hidden">
   ${comments}
   <form class="comment-form" onsubmit="addComment(event,'${post.id}')">
    <input class="field" name="comment" placeholder="اكتب تعليقك..." maxlength="250" required>
    <button class="primary">إرسال</button>
   </form>
  </div>
 </article>`;
}

function goProfile(id){
 renderProfile(id);
 go('profile');
}

function renderTimeline(){
 const posts=db.posts.filter(p=>db.users.some(u=>u.id===p.userId));

 $('timeline').innerHTML=posts.length
 ?posts.map(postCard).join('')
 :'<div class="card empty">ما فيه منشورات للحين. كن أول شخص ينشر!</div>';
}

function likePost(id){
 const p=db.posts.find(x=>x.id===id);
 if(!p)return;

 const i=p.likes.indexOf(current);

 if(i>=0)p.likes.splice(i,1);
 else{
  p.likes.push(current);
  notify(p.userId,`${me().name} أعجب بمنشورك`,id);
 }

 saveDB();
 renderTimeline();
}

function repost(id){
 const p=db.posts.find(x=>x.id===id);
 if(!p)return;

 const i=p.reposts.indexOf(current);

 if(i>=0)p.reposts.splice(i,1);
 else{
  p.reposts.push(current);
  notify(p.userId,`${me().name} أعاد نشر منشورك`,id);
 }

 saveDB();
 renderTimeline();
}

function toggleComments(id){
 $('comments-'+id).classList.toggle('hidden');
}

function addComment(event,id){
 event.preventDefault();

 const input=event.target.elements.comment;
 const text=input.value.trim();
 if(!text)return;

 const p=db.posts.find(x=>x.id===id);
 if(!p)return;

 p.comments.push({
  userId:current,
  text,
  createdAt:Date.now()
 });

 notify(p.userId,`${me().name} علّق على منشورك`,id);
 saveDB();
 renderTimeline();
 $('comments-'+id).classList.remove('hidden');
}

function notify(userId,text,postId){
 if(userId!==current){
  db.notifications.unshift({
   id:makeId(),
   userId,
   text,
   postId,
   createdAt:Date.now(),
   read:false
  });
 }
}

function renderNotifications(){
 const list=db.notifications.filter(n=>n.userId===current);

 $('notificationList').innerHTML=list.length
 ?list.map(n=>`<div class="notice">${safe(n.text)}<div class="muted small">${timeAgo(n.createdAt)}</div></div>`).join('')
 :'<div class="empty">ما عندك إشعارات حالياً.</div>';

 list.forEach(n=>n.read=true);
 saveDB();
}

function renderSearch(){
 const q=($('searchInput').value||'').trim().toLowerCase();

 const users=db.users.filter(u=>
  u.id!==current&&
  (!q||u.name.toLowerCase().includes(q)||u.username.includes(q))
 );

 const userHtml=users.map(u=>`
 <div class="user-result">
  <div class="post-head">
   <div class="avatar">${safe(u.name.slice(0,1))}</div>
   <div><b>${safe(u.name)}</b><div class="muted small">@${safe(u.username)}</div></div>
  </div>
  <button class="follow ${me().following.includes(u.id)?'on':''}" onclick="followUser('${u.id}')">
   ${me().following.includes(u.id)?'إلغاء متابعة':'متابعة'}
  </button>
 </div>`).join('');

 const posts=db.posts.filter(p=>{
  const u=db.users.find(x=>x.id===p.userId);
  return !q||p.text.toLowerCase().includes(q)||(u&&(u.name.toLowerCase().includes(q)||u.username.includes(q)));
 });

 $('searchResults').innerHTML=
 '<div class="card"><h3>الأشخاص</h3>'+
 (userHtml||'<p class="muted">ما لقينا أشخاص.</p>')+
 '</div><h3>المنشورات</h3>'+
 (posts.map(postCard).join('')||'<div class="card empty">ما لقينا منشورات.</div>');
}

function followUser(id){
 const user=me();
 if(!user)return;

 const i=user.following.indexOf(id);

 if(i>=0)user.following.splice(i,1);
 else{
  user.following.push(id);
  notify(id,`${user.name} بدأ بمتابعتك`);
 }

 saveDB();
 renderSearch();
}

function renderProfile(id){
 const user=db.users.find(u=>u.id===id);

 if(!user){
  $('profileContent').innerHTML='<div class="empty">الحساب غير موجود.</div>';
  return;
 }

 const own=id===current;
 const followers=db.users.filter(u=>u.following.includes(id)).length;

 $('profileContent').innerHTML=`
 <div class="card">
  <div class="avatar" style="width:65px;height:65px;font-size:24px">${safe(user.name.slice(0,1))}</div>
  <h2>${safe(user.name)}</h2>
  <div class="muted">@${safe(user.username)}</div>
  <p>${safe(user.bio||'لا توجد نبذة شخصية.')}</p>

  <div class="stat-row">
   <div class="stat"><b>${user.following.length}</b><span class="muted small">يتابع</span></div>
   <div class="stat"><b>${followers}</b><span class="muted small">متابعون</span></div>
   <div class="stat"><b>${db.posts.filter(p=>p.userId===id).length}</b><span class="muted small">منشورات</span></div>
  </div>

  ${own
   ?'<button class="primary" onclick="editProfile()">تعديل الملف الشخصي</button>'
   :`<button class="follow ${me().following.includes(id)?'on':''}" onclick="followUser('${id}');renderProfile('${id}')">${me().following.includes(id)?'إلغاء متابعة':'متابعة'}</button>`
  }
 </div>

 <h3>المنشورات</h3>
 ${db.posts.filter(p=>p.userId===id).map(postCard).join('')||'<div class="card empty">لا توجد منشورات.</div>'}`;
}

function editProfile(){
 const user=me();

 const name=prompt('الاسم الظاهر:',user.name);
 if(name===null)return;

 const bio=prompt('نبذة عنك:',user.bio||'');
 if(bio===null)return;

 if(!name.trim()){
  alert('الاسم لا يمكن أن يكون فارغاً.');
  return;
 }

 user.name=name.trim().slice(0,30);
 user.bio=bio.trim().slice(0,160);

 saveDB();
 start();
}

window.addEventListener('DOMContentLoaded',()=>{
 db=loadDB();

 const saved=localStorage.getItem(SESSION_KEY);

 current=saved&&db.users.some(u=>u.id===saved)
 ?saved:null;

 if(current)start();
 else showAuth();
});
</script>
</body>
</html>
